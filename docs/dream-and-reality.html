<script>
function b64(s){ return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}); }
async function decrypt(pw){
  var d=JSON.parse(document.getElementById('data').textContent);
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(d.s),iterations:d.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(d.i)},key,b64(d.c))));
}
function spy(){
  var links=[].slice.call(document.querySelectorAll('#side a[href^="#"]'));
  var heads=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1));});
  function upd(){ var y=window.scrollY+120, k=0; heads.forEach(function(h,i){ if(h&&h.offsetTop<=y) k=i; });
    links.forEach(function(a,i){ a.classList.toggle('on',i===k); }); }
  window.addEventListener('scroll',upd,{passive:true}); upd();
}
async function unlock(pw,quiet){
  var err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){ err.textContent='This browser cannot open the protected part.'; return; }
  try {
    var d=await decrypt(pw);
    var mt='<details class="mtoc"><summary>Contents</summary>'+d.toc+'</details>';
    document.getElementById('lock').remove();
    document.getElementById('art').insertAdjacentHTML('beforeend',d.head+mt+d.art);
    document.getElementById('side').innerHTML='<p class="lbl">Contents</p>'+d.toc+'<a class="back" href="./#dphil">Back to svapna.space</a>';
    document.querySelectorAll('.mtoc a').forEach(function(a){ a.addEventListener('click',function(){ a.closest('details').open=false; }); });
    try { sessionStorage.setItem('svapna-pw',pw); } catch(e) {}
    spy();
    var t=location.hash&&document.getElementById(decodeURIComponent(location.hash.slice(1))); if(t) t.scrollIntoView();
  } catch(e) { if(!quiet) err.textContent='Wrong password.'; }
}
document.getElementById('unlock').addEventListener('submit',function(ev){ ev.preventDefault(); document.getElementById('err').textContent=''; unlock(document.getElementById('pw').value,false); });
(function(){ var s=null; try { s=sessionStorage.getItem('svapna-pw'); } catch(e) {} if(s) unlock(s,true); })();
</script>
