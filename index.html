<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVAPNA Research Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* Professional Color Scheme */
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --bg-main: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 40px 0;
            box-shadow: var(--shadow-lg);
        }
        
        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        #lottie-logo {
            width: 50px;
            height: 50px;
            background: transparent;
            border-radius: 50%;
            overflow: hidden;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
            margin: 0;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            text-align: center;
            margin-top: 8px;
        }
        
        .stats-bar {
            display: flex;
            gap: 40px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: white;
        }
        
        .stat-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
            margin-top: 4px;
        }
        
        /* Main Content */
        .main-content {
            padding: 30px 0;
        }
        
        /* Tabs */
        .tabs-header {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 30px;
            background: white;
            padding: 0 20px;
            border-radius: 12px 12px 0 0;
        }
        
        .tab-button {
            padding: 16px 24px;
            background: transparent;
            color: var(--text-secondary);
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            position: relative;
        }
        
        .tab-button:hover {
            color: var(--text-primary);
        }
        
        .tab-button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .tab-badge {
            display: inline-block;
            margin-left: 8px;
            background: var(--primary-light);
            color: white;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 600;
            min-width: 24px;
            text-align: center;
        }
        
        .tab-content {
            display: none;
            background: white;
            border-radius: 0 0 12px 12px;
            padding: 30px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Search Section */
        .search-section {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }
        
        .search-container {
            position: relative;
            margin-bottom: 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 14px 120px 14px 20px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: white;
            transition: all 0.2s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .search-button {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .search-button:hover {
            background: var(--primary-dark);
            /* Removed hover movement */
        }
        
        /* Quick Search Tags */
        .shortcuts {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .shortcut-btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            background: white;
            color: var(--text-secondary);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .shortcut-btn:hover {
            border-color: var(--primary-light);
            color: var(--primary);
            /* Removed hover movement */
            box-shadow: var(--shadow-sm);
        }
        
        .shortcut-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        /* Filters */
        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .filter-select {
            padding: 10px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: white;
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--primary-light);
        }
        
        /* Results */
        .results-container {
            margin-top: 20px;
        }
        
        .search-info {
            padding: 16px;
            background: var(--bg-tertiary);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
            color: var(--text-primary);
        }
        
        .result-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }
        
        .result-card:hover {
            box-shadow: var(--shadow-md);
            /* Removed hover movement */
            border-color: var(--primary-light);
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
        }
        
        .result-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .result-meta {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: var(--text-muted);
        }
        
        .tradition-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            white-space: nowrap;
        }
        
        .tradition-Vedic {
            background: #fef3c7;
            color: #92400e;
        }
        
        .tradition-Kashmir {
            background: #ddd6fe;
            color: #5b21b6;
        }
        
        .tradition-Buddhist {
            background: #fed7aa;
            color: #c2410c;
        }
        
        .tradition-Jain {
            background: #d1fae5;
            color: #065f46;
        }
        
        /* Snippets */
        .snippets {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
        }
        
        .snippet-container {
            margin-bottom: 12px;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            border-left: 3px solid var(--primary-light);
        }
        
        .snippet {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-primary);
            font-family: 'Noto Sans Devanagari', sans-serif;
        }
        
        .snippet mark {
            background: #fef08a;
            color: var(--text-primary);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 600;
        }
        
        .snippet-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }
        
        .copy-snippet-btn, .more-context-btn {
            padding: 6px 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .copy-snippet-btn:hover, .more-context-btn:hover {
            background: var(--primary-dark);
        }
        
        .snippet.expanded {
            background: #f0f8ff;
            padding: 16px;
            border-radius: 8px;
        }
        
        /* Favorites */
        .favorite-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            margin-left: 12px;
            transition: all 0.2s;
        }
        
        .favorite-btn:hover {
            color: var(--warning);
            transform: scale(1.2);
        }
        
        .favorite-btn.active {
            color: var(--warning);
        }
        
        /* Loading */
        .loader {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 16px;
        }
        
        /* Charts */
        .chart-container {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-title">
                <div id="lottie-logo"></div>
                <h1>SVAPNA Research Dashboard</h1>
            </div>
            <div class="subtitle">Sanskrit Text Analysis & Search Interface</div>
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-value" id="unique-sources">303</span>
                    <span class="stat-label">Unique Sources</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="total-texts">311</span>
                    <span class="stat-label">Total Texts</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="results-count">0</span>
                    <span class="stat-label">Search Results</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="matches-count">0</span>
                    <span class="stat-label">Total Matches</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container main-content">
        <div class="tabs-container">
            <div class="tabs-header">
                <button class="tab-button active" onclick="switchTab('search')">
                    Search Results<span class="tab-badge" id="search-badge">0</span>
                </button>
                <button class="tab-button" onclick="switchTab('catalog')">
                    Texts Catalog<span class="tab-badge" id="catalog-badge">311</span>
                </button>
                <button class="tab-button" onclick="switchTab('visualization')">
                    Visualization
                </button>
                <button class="tab-button" onclick="switchTab('favorites')">
                    Favorites<span class="tab-badge" id="favorites-badge">0</span>
                </button>
            </div>
            
            <!-- Search Tab -->
            <div id="search-tab" class="tab-content active">
                <div class="search-section">
                    <div class="search-container">
                        <input type="text" class="search-input" id="searchInput" 
                               placeholder="Enter any Sanskrit term or text name..." 
                               value="svapna">
                        <button class="search-button" onclick="performSearch()">Search</button>
                    </div>
                    
                    <div class="filter-container" style="margin: 15px 0; display: flex; gap: 10px; align-items: center;">
                        <label style="font-weight: 600; color: var(--text-primary);">Filter by Text:</label>
                        <select id="textFilter" class="text-filter-dropdown" onchange="filterByText()" 
                                style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); 
                                       background: white; font-size: 14px; min-width: 250px; cursor: pointer;">
                            <option value="">All Texts</option>
                        </select>
                        <button class="clear-filter-btn" onclick="clearTextFilter()" 
                                style="padding: 8px 15px; border-radius: 8px; border: 1px solid var(--border);
                                       background: white; font-size: 14px; cursor: pointer; display: none;">
                            Clear Filter
                        </button>
                    </div>
                    
                    <div class="shortcuts">
                        <button class="shortcut-btn" onclick="quickSearch('svapna')">svapna</button>
                        <button class="shortcut-btn" onclick="quickSearch('svapnasvapna')">svapnasvapna</button>
                        <button class="shortcut-btn" onclick="quickSearch('svapnayoga')">svapnayoga</button>
                        <button class="shortcut-btn" onclick="quickSearch('svapnajāgrat')">svapnajāgrat</button>
                        <button class="shortcut-btn" onclick="quickSearch('svapnalabdha')">svapnalabdha</button>
                        <button class="shortcut-btn" onclick="quickSearch('nidrā')">nidrā</button>
                        <button class="shortcut-btn" onclick="quickSearch('suṣupti')">suṣupti</button>
                    </div>
                    
                    <div class="filters">
                        <select id="traditionFilter" class="filter-select" onchange="performSearch()">
                            <option value="">All Traditions</option>
                        </select>
                        <select id="periodFilter" class="filter-select" onchange="performSearch()">
                            <option value="">All Periods</option>
                        </select>
                        <select id="authorFilter" class="filter-select" onchange="performSearch()">
                            <option value="">All Authors</option>
                        </select>
                    </div>
                </div>

                <div id="searchResults" class="results-container">
                    <div class="loader">
                        <div>Loading database...</div>
                    </div>
                </div>
            </div>
            
            <!-- Catalog Tab -->
            <div id="catalog-tab" class="tab-content">
                <div class="search-section">
                    <input type="text" class="search-input" id="catalogSearch" 
                           placeholder="Filter texts by name..." 
                           onkeyup="filterCatalog()">
                </div>
                <div id="catalogContent" class="results-container"></div>
            </div>
            
            <!-- Visualization Tab -->
            <div id="visualization-tab" class="tab-content">
                <div class="chart-container">
                    <h4 class="chart-title">Texts by Tradition</h4>
                    <canvas id="traditionChart"></canvas>
                </div>
                <div class="chart-container">
                    <h4 class="chart-title">Top 10 Texts by Occurrences</h4>
                    <canvas id="topTextsChart"></canvas>
                </div>
            </div>
            
            <!-- Favorites Tab -->
            <div id="favorites-tab" class="tab-content">
                <div id="favoritesContent" class="results-container">
                    <div class="no-results">No favorites yet. Star texts from search results to add them here.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let database = null;
        let searchIndex = null;
        let fullTextDatabase = null;
        let currentResults = [];
        let allResults = [];  // Store unfiltered results
        let currentTextFilter = '';  // Current text filter
        let favorites = JSON.parse(localStorage.getItem('svapna_favorites') || '[]');
        let charts = {};
        
        // Load Lottie animation as logo
        function loadLottieAnimation() {
            const logoContainer = document.getElementById('lottie-logo');
            if (logoContainer) {
                fetch('./sleepy-sheepton.json')
                    .then(response => response.json())
                    .then(animationData => {
                        lottie.loadAnimation({
                            container: logoContainer,
                            renderer: 'svg',
                            loop: true,
                            autoplay: true,
                            animationData: animationData
                        });
                    })
                    .catch(err => console.log('Error loading Lottie logo:', err));
            }
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadLottieAnimation();
            loadData();
            
            // Setup enter key for search
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
            
            // Perform initial search for 'svapna' after a short delay to ensure data is loaded
            setTimeout(() => {
                // Mark svapna chip as active
                document.querySelectorAll('.shortcut-btn').forEach(btn => {
                    if (btn.textContent === 'svapna') {
                        btn.classList.add('active');
                    }
                });
                performSearch();
            }, 500);
        });
        
        // Load database and search index
        async function loadData() {
            try {
                // Load main database
                const dbResponse = await fetch('data.json');
                if (!dbResponse.ok) throw new Error('Failed to load database');
                database = await dbResponse.json();
                
                // Load search index
                const indexResponse = await fetch('search_index.json');
                if (!indexResponse.ok) throw new Error('Failed to load search index');
                searchIndex = await indexResponse.json();
                
                // Load full-text database (optimized version)
                try {
                    const fullTextResponse = await fetch('texts_optimized.json');
                    if (fullTextResponse.ok) {
                        fullTextDatabase = await fullTextResponse.json();
                        console.log('Optimized full-text search enabled for', fullTextDatabase.length, 'texts');
                    } else {
                        // Fallback to compressed version
                        const fallbackResponse = await fetch('texts_compressed.json');
                        if (fallbackResponse.ok) {
                            fullTextDatabase = await fallbackResponse.json();
                            console.log('Full-text search enabled for', fullTextDatabase.length, 'texts (fallback)');
                        }
                    }
                } catch (e) {
                    console.warn('Full-text database not available:', e);
                }
                
                console.log('Data loaded:', {
                    texts: database.stats.total_texts,
                    searchTerms: Object.keys(searchIndex),
                    fullTextEnabled: !!fullTextDatabase
                });
                
                // Update stats
                updateStats();
                
                // Populate filters
                populateFilters();
                
                // Update favorites badge
                updateFavoritesBadge();
                
                // Load initial search
                performSearch();
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('searchResults').innerHTML = 
                    `<div class="no-results">Error loading database: ${error.message}</div>`;
            }
        }
        
        function updateStats() {
            document.getElementById('unique-sources').textContent = database.stats.unique_sources;
            document.getElementById('total-texts').textContent = database.stats.total_texts;
            document.getElementById('catalog-badge').textContent = database.stats.total_texts;
        }
        
        function populateFilters() {
            // Tradition filter
            const traditionFilter = document.getElementById('traditionFilter');
            database.filters.traditions.forEach(tradition => {
                const option = document.createElement('option');
                option.value = tradition;
                option.textContent = tradition;
                traditionFilter.appendChild(option);
            });
            
            // Period filter
            const periodFilter = document.getElementById('periodFilter');
            database.filters.periods.forEach(period => {
                const option = document.createElement('option');
                option.value = period;
                option.textContent = period;
                periodFilter.appendChild(option);
            });
            
            // Author filter
            const authorFilter = document.getElementById('authorFilter');
            database.filters.authors.forEach(author => {
                const option = document.createElement('option');
                option.value = author;
                option.textContent = author;
                authorFilter.appendChild(option);
            });
        }
        
        function quickSearch(term) {
            document.getElementById('searchInput').value = term;
            
            // Update active button
            document.querySelectorAll('.shortcut-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === term) {
                    btn.classList.add('active');
                }
            });
            
            performSearch();
        }
        
        async function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!searchTerm) {
                document.getElementById('searchResults').innerHTML = 
                    '<div class="no-results">Please enter a search term</div>';
                document.getElementById('results-count').textContent = '0';
                document.getElementById('matches-count').textContent = '0';
                document.getElementById('search-badge').textContent = '0';
                return;
            }
            
            // Show loading state with Lottie animation
            document.getElementById('searchResults').innerHTML = 
                '<div class="loading"><div>Searching full 149MB database...</div></div>';
            
            let results = [];
            let totalMatches = 0;
            let dataSource = 'Railway (Full Database)';
            
            try {
                // Try Railway API first for full database search
                const response = await fetch('https://web-production-7d2a2.up.railway.app/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ search_term: searchTerm })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    results = data.results || [];
                    totalMatches = data.total_matches || 0;
                } else {
                    throw new Error('Railway API unavailable');
                }
            } catch (error) {
                // Fallback to local search if Railway is unavailable
                console.log('Railway unavailable, using local search:', error);
                dataSource = 'Local (Limited)';
                
                if (!database) {
                    document.getElementById('searchResults').innerHTML = 
                        '<div class="no-results">Database not loaded. Please wait...</div>';
                    return;
                }
                
                // Use full-text search if available
                if (fullTextDatabase) {
                    results = searchFullText(searchTerm);
                    totalMatches = results.reduce((sum, r) => sum + r.count, 0);
                } else if (searchIndex && searchIndex[searchTerm]) {
                    // Fall back to precomputed results
                    results = searchIndex[searchTerm].results;
                    totalMatches = searchIndex[searchTerm].total_matches;
                } else {
                    // Last resort: metadata search
                    results = database.texts.filter(text => {
                        const nameMatch = text.display_name && text.display_name.toLowerCase().includes(searchTerm);
                        const authorMatch = text.author && text.author.toLowerCase().includes(searchTerm);
                        const traditionMatch = text.tradition && text.tradition.toLowerCase().includes(searchTerm);
                        const categoryMatch = text.category && text.category.toLowerCase().includes(searchTerm);
                        const subcategoryMatch = text.subcategory && text.subcategory.toLowerCase().includes(searchTerm);
                        const periodMatch = text.period && text.period.toLowerCase().includes(searchTerm);
                        
                        return nameMatch || authorMatch || traditionMatch || categoryMatch || subcategoryMatch || periodMatch;
                    }).map(text => ({
                        ...text,
                        snippets: [],
                        count: 0
                    }));
                }
            }
            
            // Apply filters
            const traditionFilter = document.getElementById('traditionFilter').value;
            const periodFilter = document.getElementById('periodFilter').value;
            const authorFilter = document.getElementById('authorFilter').value;
            
            if (traditionFilter) {
                results = results.filter(r => r.tradition === traditionFilter);
            }
            if (periodFilter) {
                results = results.filter(r => r.period === periodFilter);
            }
            if (authorFilter) {
                results = results.filter(r => r.author === authorFilter);
            }
            
            // Store results globally
            allResults = results;
            currentResults = results;
            
            // Populate text filter dropdown
            populateTextFilter(results);
            
            // Update counts
            const filteredMatches = results.reduce((sum, r) => sum + r.count, 0);
            document.getElementById('results-count').textContent = results.length;
            document.getElementById('search-badge').textContent = results.length;
            document.getElementById('matches-count').textContent = filteredMatches || totalMatches || 0;
            
            // Clear previous results
            document.getElementById('searchResults').innerHTML = '';
            
            // Display results
            displayResults(results, searchTerm);

        function searchFullText(searchTerm) {
            const termLower = searchTerm.toLowerCase();
            const results = [];
            
            for (const text of fullTextDatabase) {
                const contentLower = (text.content || '').toLowerCase();
                const nameLower = text.display_name.toLowerCase();
                const authorLower = text.author.toLowerCase();
                
                // Count occurrences in content
                const contentMatches = (contentLower.match(new RegExp(termLower, 'g')) || []).length;
                const nameMatches = nameLower.includes(termLower) ? 1 : 0;
                const authorMatches = authorLower.includes(termLower) ? 1 : 0;
                
                const totalCount = contentMatches + nameMatches + authorMatches;
                
                if (totalCount > 0) {
                    // Extract snippets from content
                    const snippets = [];
                    if (contentMatches > 0) {
                        let pos = 0;
                        for (let i = 0; i < Math.min(5, contentMatches); i++) {
                            pos = contentLower.indexOf(termLower, pos);
                            if (pos === -1) break;
                            
                            const start = Math.max(0, pos - 80);
                            const end = Math.min(text.content.length, pos + termLower.length + 80);
                            let snippet = text.content.substring(start, end);
                            
                            snippet = snippet.replace(/\s+/g, ' ').trim();
                            if (start > 0) snippet = '...' + snippet;
                            if (end < text.content.length) snippet += '...';
                            
                            snippets.push(snippet);
                            pos = pos + termLower.length;
                        }
                    }
                    
                    results.push({
                        filename: text.filename,
                        display_name: text.display_name,
                        tradition: text.tradition,
                        author: text.author,
                        period: text.period || 'Unknown',
                        count: totalCount,
                        snippets: snippets
                    });
                }
            }
            
            return results.sort((a, b) => b.count - a.count);
        }

        function extractExtendedContext(fullContent, searchTerm, occurrenceIndex) {
            const lines = fullContent.split('\n');
            const termLower = searchTerm.toLowerCase();
            let foundCount = 0;
            
            // Find the nth occurrence
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].toLowerCase().includes(termLower)) {
                    if (foundCount === occurrenceIndex) {
                        // Found the target occurrence, extract 10 lines around it
                        const start = Math.max(0, i - 5);
                        const end = Math.min(lines.length, i + 6);
                        const contextLines = lines.slice(start, end);
                        
                        // Add line markers if truncated
                        let result = '';
                        if (start > 0) result += '... [Previous lines omitted] ...\n\n';
                        result += contextLines.join('\n');
                        if (end < lines.length) result += '\n\n... [Following lines omitted] ...';
                        
                        return result;
                    }
                    foundCount++;
                }
            }
            
            return null;
        }

                                    <span>Period: ${text.period}</span>
                                </div>
                            </div>
                            <div class="tradition-badge ${traditionClass}">${text.tradition}</div>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('favoritesContent').innerHTML = html;
        }
    </script>
</body>
</html>
